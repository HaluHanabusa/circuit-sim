[project]
name = "circuit-sim"
version = "0.0.1"
description = "設計書から回路と制御系を組み、目標値に対してPIDゲインを最適化するシミュレータ（M0）"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
circuit-sim = "circuit_sim.app.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["circuit_sim*"]

# 画面のビルド結果と同梱のサンプルを、パッケージに入れる（利用者に Node.js は要らない。D-041）
[tool.setuptools.package-data]
"circuit_sim.app" = ["static/*", "static/assets/*", "samples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
