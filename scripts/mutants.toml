# 1か所ずつ壊す確認（scripts/mutants.py）の一覧。
#
# [[mutant]]: 機械的には作れない壊し方を、手で書く。original は、file の中にちょうど1つある文字列。
# [[equivalent]]: 壊しても動作が変わらない（同値の）ため、どのOSの試験でも落とせない壊し方。番号は
#   `python scripts/mutants.py list` が表示するもの。理由を必ず書く。理由は、事実（git や Python の決まり、
#   コードの流れ）で書き、確かめた方法も書く。
# [[platform_only]]: そのOS（platform。windows か posix）でだけ通る分岐で、ほかのOSでは落とせない壊し方。
#   同値ではない。そのOSでは流し、ほかのOSでは流さずに、結果に別に数える。確かめ方（そのOSの実物の試験、
#   コードを読んだ判断）を書く（D-052）。

[[mutant]]
id = "hand:lock-shared"
file = "scripts/cycle.py"
original = "fcntl.flock(handle, fcntl.LOCK_EX)"
replacement = "fcntl.flock(handle, fcntl.LOCK_SH)"

# ---- 同値（壊しても動作が変わらない）

[[equivalent]]
id = "cycle:run_captured:const:1"
reason = "Popen に encoding を渡すと、text の指定によらず文字列で受け取る。Python の subprocess は、text_mode を encoding or errors or text or universal_newlines で決める（3.11〜3.13 の Lib/subprocess.py で確かめた）。text=False にしても、encoding='utf-8' があるので、出力は同じ文字列になる"

# ---- 別枠（いまは無い）
# Windows でだけ通る分岐のうち、OSの仕組みを模擬できるもの（msvcrt.locking、taskkill の呼び出し）は、
# tests/test_harness_os.py が、どのOSでも模擬して流すので、Linux でも落ちる（H2 の見直しで、別枠の3件
# cycle:lock_handle:del:3、cycle:unlock_handle:del:2、cycle:kill_tree:del:1 と、cycle:kill_tree:del:3 を落とした）。
# 模擬できない分岐の生き残りは、次の形で書く:
#
# [[platform_only]]
# id = "<番号>"
# platform = "windows"
# reason = "<なぜ Linux では落とせないか。Windows の実物の試験か、コードを読んだ判断で、どう確かめたか>"
